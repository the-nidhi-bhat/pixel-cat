<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Cat</title>
    <style>body{margin:0;background:#fff8ef;color:#443f4f;font:16px system-ui,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{max-width:340px;text-align:center;background:#fff;border:2px solid #eadfd1;border-radius:28px;padding:32px;box-shadow:0 16px 40px #443f4f18}.cat{font-size:88px;animation:bob 2.4s ease-in-out infinite}.button{border:0;border-radius:999px;background:#e88468;color:#fff;padding:12px 18px;font-weight:700;cursor:pointer}@keyframes bob{50%{transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){.cat{animation:none}}</style>
  </head>
  <body><main><section class="card"><div class="cat" aria-hidden="true">🐱</div><h1>Pixel Cat is home</h1><p>Your tiny local companion is ready for a cozy focus session.</p><button class="button" id="break">Take a tiny break</button></section></main><script>document.querySelector('#break').addEventListener('click',()=>window.pixelCat?.notify('Pixel Cat','Stretch those shoulders, cozy human.'))</script></body>
</html>
